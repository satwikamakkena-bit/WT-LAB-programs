<!DOCTYPE html
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>feedback</title>
</head>
<body>
    <h2>feedback form</h2>
    <form action="# method="post>
        <label>name:</label><br>
        <input type="text" name="name"
        <br><br>
        <label>rate of our service:</label>
        <select name="rating">
            <option> excelent</option>
            <option> good</option>
            <option> average</option>
            <option> poor</option>
        </select>
        <br><br>
        <label>comments:</label><br>
        <textarea name="comments"
             rows="4"
             cols="4"></textarea>
        <br><br>
        <input type="submit" value="submit feedback">
    </form>
</body>
</html>
