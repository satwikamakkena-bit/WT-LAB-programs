<!DOCTYPE html>
<html lang="en"
<head>
    <meta charset="UTF-8">
    <title> registration form </title>
</head>
<body>
    <h2> stident registration form </h2>
    <form action="#" method="post">
        <label>full name</label><br>
        <input type="text" name="name"requied>
        <br><br>
        <label>email</label><br>
        <input type="email" name="email"requied>
        <br><br>
        <label>pass word</label><br>
        <input type="password" name="pssword"requied>
        <br><br>
        <label>gender</label><br>
        <input type="radio" name="gender" value="M"> 
        <input type="radio" name="gender" value="F">
        <br><br>
        <label>course:</label><br>
        <input type="check box" name="course" value="web">
        <input type="check box" name="course" value="python">
        <br><br>
        <label>date of birth</label><br>
        <input type="date" name="dob">
        <br><br>
        <label>country</label><br>
        <select name="country">
            <option>india</option>
            <option>usa</option>
            <option>uk</option>
        </select>
        <br><br>
        <input type="submit" value="register">
        <input type="reset" value="clear">
    </form>
</body>
</html>
